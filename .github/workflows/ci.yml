name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CDK_VERSION: "2.1148.1"
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test-unit test-property test-integration test-infra
      - run: make coverage
      - run: npx --yes aws-cdk@$CDK_VERSION synth
      - run: make build-images
      - run: docker run --rm --entrypoint python portfolio-markowitz-ingest -c "import ingest.handler"
      - run: docker run --rm --entrypoint python portfolio-markowitz-clean -c "import clean.handler"
      - run: docker run --rm --entrypoint python portfolio-markowitz-optimizer -c "import optimizer.handler"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: cdk-diff
      - if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: npx --yes aws-cdk@$CDK_VERSION diff
